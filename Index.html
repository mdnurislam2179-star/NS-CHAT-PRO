<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS CHAT - AI Assistant</title>
    <style>
        body {
            background-color: #0A0E17;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .api-container {
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        .api-container input {
            width: 100%;
            padding: 8px;
            background: #111a2e;
            border: 1px solid #00ffcc;
            color: white;
            border-radius: 5px;
        }
        .chat-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            min-height: 80px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #cfd8dc;
        }
        .visualizer {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,204,0.2) 0%, rgba(10,14,23,1) 70%);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            font-size: 40px;
            transition: 0.3s;
        }
        .visualizer.active {
            box-shadow: 0 0 50px #ff4757;
            background: radial-gradient(circle, rgba(255,71,87,0.3) 0%, rgba(10,14,23,1) 70%);
        }
        .mic-btn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transition: 0.2s;
        }
        .mic-btn.active {
            background-color: #ff4757;
            color: #fff;
        }
        .response-text {
            color: #00ffcc;
            text-align: center;
            max-width: 400px;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>NS CHAT</h2>

    <!-- API Key Input Box -->
    <div class="api-container">
        <input type="password" id="apiKey" placeholder="AQ.Ab8RN6IjRvyQo0B2jw6wVykcSRjMoAidipvTJ9NwJ26Mo2yWqA">
    </div>

    <!-- User Speech Box -->
    <div class="chat-box" id="userSpeech">
        কথা বলতে নিচের মাইক বাটন চাপুন...
    </div>

    <!-- Center Glowing Animation -->
    <div class="visualizer" id="visualizer">🎙️</div>

    <!-- AI Response Text -->
    <div class="response-text" id="aiResponse">
        আমি NS CHAT, আপনার ব্যক্তিগত এআই সহকারী।
    </div>

    <br>
    <!-- Mic Button -->
    <button class="mic-btn" id="micBtn" onclick="toggleSpeech()">🎤</button>

    <script>
        const userSpeechElem = document.getElementById('userSpeech');
        const aiResponseElem = document.getElementById('aiResponse');
        const visualizer = document.getElementById('visualizer');
        const micBtn = document.getElementById('micBtn');
        const apiKeyInput = document.getElementById('apiKey');

        let recognition;
        let isListening = false;

        // Speech Recognition Setup
        if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD'; // বাংলা ভাষা সেট করা
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                visualizer.classList.add('active');
                micBtn.classList.add('active');
            };

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                userSpeechElem.innerText = "আপনি: " + speechToText;
                processCommand(speechToText);
            };

            recognition.onerror = function(event) {
                aiResponseElem.innerText = "ত্রুটি: " + event.error;
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        } else {
            alert('আপনার ব্রাউজার ভয়েস রিকগনিশন সাপোর্ট করে না। দয়া করে Google Chrome ব্রাউজার ব্যবহার করুন।');
        }

        function toggleSpeech() {
            if (!isListening) {
                try {
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            } else {
                recognition.stop();
                stopListening();
            }
        }

        function stopListening() {
            isListening = false;
            visualizer.classList.remove('active');
            micBtn.classList.remove('active');
        }

        // Text to Speech (Voice Output)
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD';
            window.speechSynthesis.speak(utterance);
        }

        // Command Processor & Gemini API Call
        async function processCommand(command) {
            const lowerCmd = command.toLowerCase();
            const apiKey = apiKeyInput.value.trim();

            // ১. অ্যাপ ওপেন ও সার্চ কমান্ড হ্যান্ডেলিং
            if (lowerCmd.includes("youtube open") || lowerCmd.includes("ইউটিউব ওপেন")) {
                speak("ইউটিউব ওপেন করা হচ্ছে");
                aiResponseElem.innerText = "ইউটিউব ওপেন করা হচ্ছে...";
                window.open("https://www.youtube.com", "_blank");
                return;
            } 
            else if (lowerCmd.includes("facebook open") || lowerCmd.includes("ফেসবুক ওপেন")) {
                speak("ফেসবুক ওপেন করা হচ্ছে");
                aiResponseElem.innerText = "ফেসবুক ওপেন করা হচ্ছে...";
                window.open("https://www.facebook.com", "_blank");
                return;
            } 
            else if (lowerCmd.includes("instagram open") || lowerCmd.includes("ইনস্টাগ্রাম ওপেন")) {
                speak("ইনস্টাগ্রাম ওপেন করা হচ্ছে");
                aiResponseElem.innerText = "ইনস্টাগ্রাম ওপেন করা হচ্ছে...";
                window.open("https://www.instagram.com", "_blank");
                return;
            } 
            else if (lowerCmd.includes("motu patlu") || lowerCmd.includes("মটু পাতলু")) {
                speak("ইউটিউবে মটু পাতলু প্লে করা হচ্ছে");
                aiResponseElem.innerText = "ইউটিউবে মটু পাতলু প্লে করা হচ্ছে...";
                window.open("https://www.youtube.com/results?search_query=motu+patlu", "_blank");
                return;
            }

            // ২. API Key না থাকলে সতর্ক করা
            if (!apiKey) {
                const msg = "দয়া করে উপরের বক্সে আপনার Gemini API Key দিন।";
                aiResponseElem.innerText = msg;
                speak(msg);
                return;
            }

            // ৩. Gemini API এর মাধ্যমে চ্যাট উত্তর জেনারেট করা
            aiResponseElem.innerText = "ভাবছি...";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: command }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    aiResponseElem.innerText = reply;
                    speak(reply);
                } else {
                    aiResponseElem.innerText = "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";
                    speak("দুঃখিত, কোনো উত্তর পাওয়া যায়নি।");
                }
            } catch (error) {
                aiResponseElem.innerText = "নেটওয়ার্ক বা এপিআই কানেকশনে সমস্যা হয়েছে।";
                speak("সমস্যা হয়েছে।");
            }
        }
    </script>
</body>
  </html>
